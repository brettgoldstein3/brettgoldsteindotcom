  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {

      overflow: hidden;

    #stage { position: fixed; inset: 0; }
    #stage canvas {
      display: block; width: 100%; height: 100%;
      touch-action: none;
      opacity: 0; transition: opacity 0.9s ease;
    }
    #stage canvas.ready { opacity: 1; }
    #stage canvas.hover { cursor: pointer; }
    #stage canvas.reading { cursor: grab; }
    #stage canvas.dragging { cursor: grabbing; }
    /* Flat covers: shown only if the 3D shelf can't start (no WebGL, or an error). */
    #flat {
      position: fixed; inset: 4rem 0 3rem; padding: 0 1.4rem;
      display: flex; flex-wrap: wrap; gap: 1rem;
      justify-content: center; align-content: safe center;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      transition: opacity 0.6s ease;
    }
    #flat img { display: block; height: min(26vh, 15rem); width: auto; max-width: 40vw; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6); }
    #flat.hidden { opacity: 0; pointer-events: none; }
    /* Shown while the shelf is being built */
    #loading {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.45;
      transition: opacity 0.4s ease;
    }
    #loading.done { opacity: 0; }
    .bar {
      position: fixed; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 1.1rem max(1.4rem, env(safe-area-inset-right)) 1.1rem max(1.4rem, env(safe-area-inset-left));
      font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase;
      pointer-events: none;
    }
    .bar a, .bar button { color: inherit; text-decoration: none; pointer-events: auto; }
    .bar a:hover, .bar button:hover { text-decoration: underline; }
    .bar button {
      background: none; border: 0; cursor: pointer;
      font: inherit; letter-spacing: inherit; text-transform: inherit;
    }
    /* Clear of the notch and the home indicator on phones */
    .top { top: 0; padding-top: max(1.1rem, env(safe-area-inset-top)); }
    .bottom { bottom: 0; padding-bottom: max(1.1rem, env(safe-area-inset-bottom)); transition: opacity 0.3s ease; }
    body.reading .bottom { opacity: 0; }
    .dim { opacity: 0.55; }

      font-family: Fraunces, Georgia, serif; font-weight: 500;
      font-size: 0.95rem; letter-spacing: 0; text-transform: none;
    }

       Its top is set by script to sit just below the books. */
    #titles {
      position: fixed; top: 80vh; left: 0; right: 0;
      overflow: hidden; pointer-events: none;
      opacity: 0; transition: opacity 0.5s ease;
    }
    #titles.ready { opacity: 1; }
    #titles.ready.away { opacity: 0; }
    #titles .track {
      display: flex; align-items: flex-start; gap: clamp(1.6rem, 4vw, 3.4rem); width: max-content;

    #titles .t {

      color: inherit; text-align: center;

      width: max-content; max-width: min(86vw, 15em);

      font-size: clamp(1.25rem, 2.6vw, 2.3rem); line-height: 1.12;

    #titles .t:hover { opacity: 0.7; }
    #titles .t.on:hover { opacity: 1; }

      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.7rem; letter-spacing: 0.08em; vertical-align: top;
      margin-left: 0.4em; position: relative; top: 0.5em;
    }
    /* Buttons over the front-facing cover */
    #actions {
      position: fixed; left: 0; top: 0;
      display: flex; gap: 0.7rem;
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease;

    #actions button:hover, #actions a:hover { background: #f3ead8; color: #0b0a09; }
    /* The post beside a book that's being read */
    #panel {
      position: fixed; top: 0; bottom: 0; right: 0; width: 48vw;

      #panel, #panel.open {
        top: 0; left: 0; width: auto; padding: 0;
        pointer-events: none;

      #panel.open .inner { pointer-events: auto; }

      body.reading .top { z-index: 2; background: linear-gradient(to bottom, #0b0a09 55%, rgba(11, 10, 9, 0)); }
      #panel .inner {

      #panel .note { font-size: 3rem; }
      #panel h2 { font-size: 1.4rem; }

    /* Section switch: the kind of book on the shelf, large across the top */
    #sections {
      position: fixed; top: calc(3.4rem + env(safe-area-inset-top)); left: 0; right: 0;
      display: flex; justify-content: center; gap: clamp(1.2rem, 3.5vw, 2.6rem);

    body.reading #sections { opacity: 0; pointer-events: none; }
    #sections button {
      background: none; border: 0; padding: 0; cursor: pointer; color: inherit; white-space: nowrap;
      font-family: Fraunces, Georgia, serif; font-weight: 400; letter-spacing: -0.02em;

    #sections button.on { opacity: 1; }
    #sections button:hover { opacity: 0.7; }
    #sections button.on:hover { opacity: 1; }
    @media (max-width: 360px) {
      #sections { gap: 1rem; }
      #sections button { font-size: 1.3rem; }
    }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    [hidden] { display: none !important; }
  </style>

    window.showFlat = function () {
      var flat = document.getElementById('flat');
      document.getElementById('loading').classList.add('done');
      if (!flat.children.length) {
        [
          ['the-trillion-dollar-super-app-is-finally-coming', 'The Trillion-dollar Super App is Finally Coming', true],
          ['doubling-my-life-at-36', 'Doubling My Life at 36', true],

          ['the-four-micro-revolutions-of-the-intelligence-revolution', 'The Four Micro-Revolutions of the Intelligence Revolution', true],
          ['the-last-job-for-mankind-context-farming', 'The Last Job for Mankind: Context Farming', true],
          ['how-i-became-technical-af', 'How I became technical AF', true],
          ['unrest', 'The Unrest of My Life'],
          ['boundless-creation', 'Boundless Creation'],
          ['as-many-hours', 'As Many Hours as Possible'],
          ['144-days', '144 Days'],
          ['buckle-up', 'Buckle Up, Don’t Worry'],
          ['everything-happens', 'Everything Happens So Much'],
        ].forEach(function (b) {
          var img = document.createElement('img');
          img.src = '../assets/book/' + b[0] + '-zine-cover.webp';
          img.alt = b[1] + ' by Brett Goldstein';
          img.loading = 'lazy';
          var item = img;
          if (b[2]) { item = document.createElement('a'); item.href = '../writing/' + b[0] + '/'; item.appendChild(img); }
          flat.appendChild(item);
        });
      }
      flat.classList.remove('hidden');
    };
    window.shelfFallback = setTimeout(window.showFlat, 15000);

    const SECTIONS = [
      // `scale` sizes the books: the annual reflections are smaller, pocket-sized zines.
      { id: 'essays', label: 'Essays', style: SHELF_STYLE, list: ESSAYS, active: 0, scale: 1 },
      { id: 'reflections', label: 'Annual Reflections', style: SHELF_STYLE, list: BOOKS, active: 0, scale: 0.84 },
    ];

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    function canvasOf(w, h) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      return c;
    }

    // Box blur of a single-channel image, done as two running-sum passes.
    function boxBlur(src, w, h, r) {
      const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
      for (let y = 0; y < h; y++) {
        let sum = 0;
        for (let x = -r; x <= r; x++) sum += src[y * w + Math.min(w - 1, Math.max(0, x))];
        for (let x = 0; x < w; x++) {
          tmp[y * w + x] = sum / (2 * r + 1);
          sum += src[y * w + Math.min(w - 1, x + r + 1)] - src[y * w + Math.max(0, x - r)];
        }
      }
      for (let x = 0; x < w; x++) {
        let sum = 0;
        for (let y = -r; y <= r; y++) sum += tmp[Math.min(h - 1, Math.max(0, y)) * w + x];
        for (let y = 0; y < h; y++) {
          out[y * w + x] = sum / (2 * r + 1);
          sum += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x];
        }
      }
      return out;
    }

    // The cloth is the most common colour around the cover's border; art that
    // bleeds off one edge doesn't fool it.
    function clothColour(ctx, w, h) {
      const px = ctx.getImageData(0, 0, w, h).data;
      const band = Math.round(w * 0.04);
      const buckets = new Map();
      const add = (x, y) => {
        const o = (y * w + x) * 4;
        const key = (px[o] >> 4) << 8 | (px[o + 1] >> 4) << 4 | px[o + 2] >> 4;
        const b = buckets.get(key) || [0, 0, 0, 0];
        b[0] += px[o]; b[1] += px[o + 1]; b[2] += px[o + 2]; b[3]++;
        buckets.set(key, b);
      };
      for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) {
        if (x < band || x >= w - band || y < band || y >= h - band) add(x, y);
      }
      const best = [...buckets.values()].sort((a, b) => b[3] - a[3])[0];
      return [best[0] / best[3], best[1] / best[3], best[2] / best[3]].map(Math.round);
    }

    /*
     * Derive the surface of a cloth-bound cover from flat artwork.
     * Anything that differs from the cloth colour counts as ink. Fine, light
     * lettering is stamped foil: pressed in, smooth and metallic. Large areas
     * of ink are printed: they keep the cloth's weave and stay matte.
     * Packed into one texture: red = height, green = roughness, blue = metalness.
     */
    function surfaceMap(src, cloth, { groove = false } = {}) {
      const w = src.width, h = src.height;
      const px = src.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, w, h).data;
      const clothLum = luma(cloth[0], cloth[1], cloth[2]);

      const raw = new Float32Array(w * h);
      for (let i = 0; i < w * h; i++) {
        const o = i * 4;
        const d = Math.hypot(px[o] - cloth[0], px[o + 1] - cloth[1], px[o + 2] - cloth[2]);
        raw[i] = smoothstep(40, 90, d);
      }
      const mask = boxBlur(raw, w, h, 1);
      // How much ink surrounds each texel: high inside illustrations, low along thin strokes.
      const mass = boxBlur(raw, w, h, Math.round(w * 0.014));

      const out = canvasOf(w, h);
      const ctx = out.getContext('2d');
      const data = ctx.createImageData(w, h);
      const THREAD = Math.max(1, Math.round(w / 384));   // cloth thread width in texels
      const grooveX = w * 0.045, grooveW = w * 0.012;

      for (let y = 0; y < h; y++) {
        const ty = Math.floor(y / THREAD);
        for (let x = 0; x < w; x++) {
          const i = y * w + x, o = i * 4;
          const m = mask[i];
          const fine = m * (1 - smoothstep(0.35, 0.6, mass[i]));     // ink that's part of thin lettering
          const lum = luma(px[o], px[o + 1], px[o + 2]);
          const lighter = smoothstep(0.02, 0.15, lum - clothLum);
          const grain = hash(i * 0.731);

          if (S.paper) {
            // Printed paper: nearly flat, evenly matte, ink a touch smoother, a scored hinge.
            // Zine stock is rougher, and photocopier toner sits on it with a faint sheen.
            let height = 0.5 + (grain - 0.5) * (S.tooth ? 0.16 : S.gloss ? 0.015 : 0.06);
            if (groove && !S.tooth && !S.gloss) { const g = (x - grooveX) / grooveW; height -= 0.2 * Math.exp(-g * g); }
            data.data[o] = height * 255;
            data.data[o + 1] = (S.gloss ? 0.64 + grain * 0.03 : S.tooth ? lerp(0.86 + grain * 0.08, 0.62, m) : lerp(0.66 + grain * 0.06, 0.52, m)) * 255;
            data.data[o + 2] = 0;
            data.data[o + 3] = 255;
            continue;
          }

          // Plain weave: alternate which thread sits on top.
          const tx = Math.floor(x / THREAD);
          const over = (tx + ty) & 1;
          const weave = (over ? 0.55 + 0.45 * hash(tx) : 0.2 + 0.45 * hash(ty + 7919)) + (grain - 0.5) * 0.2;

          let height = lerp(0.55 + (weave - 0.5) * 0.4, 0.32, fine);          // foil is pressed into the cloth
          if (groove) { const g = (x - grooveX) / grooveW; height -= 0.45 * Math.exp(-g * g); }
          let rough = 0.88 + grain * 0.08;
          rough = lerp(rough, 0.74, m - fine);                                 // printed ink: a little less dry
          rough = lerp(rough, 0.26 + (1 - lum) * 0.25, fine);                  // stamped: smooth
          const metal = fine * lerp(0.15, 0.9, lighter);

          data.data[o] = Math.min(255, Math.max(0, height * 255));
          data.data[o + 1] = rough * 255;
          data.data[o + 2] = metal * 255;
          data.data[o + 3] = 255;
        }
      }
      ctx.putImageData(data, 0, 0);
      return out;
    }

    const rgb = (c) => `rgb(${c.join(',')})`;

    // A spine in the style of the book's cover, reading top to bottom, with the age at its foot.
    function drawSpine(info, cloth, thickness, note) {
      const c = canvasOf(Math.round(SPINE_H * thickness / H), SPINE_H);
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.fillStyle = rgb(cloth);
      ctx.fillRect(0, 0, c.width, c.height);
      if (!S.spineText) return c;       // too thin to letter
      ctx.fillStyle = info.ink;
      const wide = c.width;
      const serif = info.type === 'serif';
      const spaced = (px) => { if ('letterSpacing' in ctx) ctx.letterSpacing = `${px}px`; };

      // Age or year, upright at the foot of the spine.
      if (note) {
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.font = `500 ${Math.round(wide * 0.2)}px ${MONO}`;
        spaced(1);
        ctx.fillText(note, wide / 2, c.height - 52);
      }

      ctx.save();
      ctx.translate(wide / 2, 0);
      ctx.rotate(Math.PI / 2);
      ctx.textBaseline = 'middle';
      const TOP = 84, FOOT = 150;          // keep clear of the head and the age

      // Author first, small, toward the head.
      ctx.textAlign = 'left';
      if (serif) { ctx.font = `italic 400 ${Math.round(wide * 0.24)}px ${SERIF}`; spaced(0); }
      else { ctx.font = `500 ${Math.round(wide * 0.15)}px ${SANS}`; spaced(Math.round(wide * 0.05)); }
      const author = serif ? AUTHOR : AUTHOR.toUpperCase();
      ctx.fillText(author, TOP, 0);
      const authorEnd = TOP + ctx.measureText(author).width;

      // Title fills the rest, shrunk if it would run into the author or the foot.
      const title = info.caps ? info.title.toUpperCase() : info.title;
      const fontAt = (size) => serif ? `400 ${size}px ${SERIF}`
        : info.caps ? `600 ${size}px ${SANS}` : `500 ${size}px ${SANS}`;
      const track = (size) => info.caps ? Math.round(size * 0.18) : 0;
      let size = Math.round(wide * (info.caps ? 0.24 : 0.36));
      const room = c.height - FOOT - (authorEnd + 90);
      ctx.font = fontAt(size); spaced(track(size));
      const width = ctx.measureText(title).width;
      if (width > room) { size = Math.floor(size * room / width); ctx.font = fontAt(size); spaced(track(size)); }
      ctx.textAlign = 'right';
      ctx.fillText(title, c.height - FOOT, 0);

      if (info.accent) {
        ctx.fillStyle = info.accent;
        const end = c.height - FOOT - ctx.measureText(title).width - 36;
        ctx.fillRect(end - 26, -1.5, 26, 3);
      }
      ctx.restore();
      return c;
    }

    // The back cover: plain cloth with the author and age small at the foot.
    // Drawn mirrored, because the back board shares the front board's UVs.
    function drawBack(info, cloth, note) {
      const c = canvasOf(BACK_W, BACK_H);
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.fillStyle = rgb(cloth);
      ctx.fillRect(0, 0, c.width, c.height);
      // Lay out on a 768 × 1152 page, mirrored.
      const k = BACK_W / 768;
      ctx.setTransform(-k, 0, 0, k, BACK_W, 0);
      ctx.fillStyle = info.ink;
      ctx.font = `500 22px ${MONO}`;
      if ('letterSpacing' in ctx) ctx.letterSpacing = '5px';
      ctx.fillText(AUTHOR.toUpperCase(), 96, 1152 - 120);
      if (note) { ctx.textAlign = 'right'; ctx.fillText(note, 768 - 96, 1152 - 120); }
      return c;
    }

    // Back-cover artwork, flipped to suit the back board, which shares the front board's UVs.
    function mirrored(img) {
      const c = canvasOf(MAP_W, MAP_H);
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.setTransform(-1, 0, 0, 1, MAP_W, 0);
      ctx.drawImage(img, 0, 0, MAP_W, MAP_H);
      return c;
    }

    // Break text into lines no wider than `max` at the context's current font.
    function wrap(ctx, text, max) {
      const lines = [];
      let line = '';
      for (const word of text.split(' ')) {
        const next = line ? `${line} ${word}` : word;
        if (line && ctx.measureText(next).width > max) { lines.push(line); line = word; } else line = next;
      }
      if (line) lines.push(line);
      return lines;
    }

    // Print `src` (a crop of the hero image) as halftone dots into the given box: the second
    // ink carries the whole image, the main ink only the strongest tones, slightly out of
    // register. On dark paper the inks are light, so they print the image's lights instead.
    function halftone(ctx, src, sx, sy, sw, sh, x, y, w, h, essay) {
      const CELL = 11;
      const cols = Math.ceil(w / CELL), rows = Math.ceil(h / CELL);
      const sample = canvasOf(cols, rows);
      const sctx = sample.getContext('2d', { willReadFrequently: true });
      sctx.drawImage(src, sx, sy, sw, sh, 0, 0, cols, rows);
      const px = sctx.getImageData(0, 0, cols, rows).data;
      // Stretch each image's tones to the full range, so pale drawings still print with weight.
      const raw = new Float32Array(cols * rows);
      for (let i = 0; i < raw.length; i++) raw[i] = 1 - luma(px[i * 4], px[i * 4 + 1], px[i * 4 + 2]);
      const sorted = Float32Array.from(raw).sort();
      const lo = sorted[Math.floor(sorted.length * 0.04)], hi = sorted[Math.floor(sorted.length * 0.97)];
      const onDark = luma(...hexRGB(essay.paper)) < 0.35;
      const dark = (i) => {
        const v = Math.min(1, Math.max(0, (raw[i] - lo) / Math.max(0.05, hi - lo)));
        return onDark ? 1 - v : v;
      };
      ctx.save();
      ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
      ctx.globalCompositeOperation = onDark ? 'screen' : 'multiply';
      const layer = (colour, amount, dx, dy, shift) => {
        ctx.fillStyle = colour;
        for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) {
          // Fade toward the panel's edges, so the image floats on the paper like the zines' art.
          const edge = Math.min(q / cols, 1 - q / cols, (r / rows) * 1.5, (1 - r / rows) * 1.5);
          const a = amount(dark(r * cols + q)) * smoothstep(0, 0.2, edge);
          if (a < 0.04) continue;
          const cx = x + (q + 0.5 + (shift && r % 2 ? 0.5 : 0)) * CELL + dx, cy = y + (r + 0.5) * CELL + dy;
          ctx.beginPath(); ctx.arc(cx, cy, Math.min(0.72, a * 0.72) * CELL, 0, Math.PI * 2); ctx.fill();
        }
      };
      layer(essay.accent, (d) => Math.pow(d, 0.9) * 0.95, 3, -2, true);
      layer(essay.ink, (d) => smoothstep(0.38, 1, d), 0, 0, false);
      ctx.restore();
    }

    const hexRGB = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));

    // Uneven ink and paper fleck, so the cover reads as printed stock rather than a flat fill.
    function speckle(ctx, w, h, colour, seed) {
      ctx.save();
      ctx.fillStyle = colour;
      for (let i = 0; i < 2600; i++) {
        ctx.globalAlpha = 0.05 + 0.18 * hash(seed + i * 3.1);
        const r = 0.6 + 1.6 * hash(seed + i * 7.7);
        ctx.fillRect(hash(seed + i * 1.3) * w, hash(seed + i * 5.9) * h, r, r);
      }
      ctx.restore();
    }

    // A cover for an essay, laid out on a 1024 × 1536 page.
    function drawEssayCover(essay, hero, number) {
      const c = canvasOf(1024, 1536);
      const ctx = c.getContext('2d', { willReadFrequently: true });
      const M = 92;
      ctx.fillStyle = essay.paper;
      ctx.fillRect(0, 0, c.width, c.height);
      speckle(ctx, c.width, c.height, essay.ink, number * 97);

      ctx.fillStyle = essay.ink;
      ctx.textBaseline = 'alphabetic';
      if ('letterSpacing' in ctx) ctx.letterSpacing = '5px';
      ctx.font = `500 22px ${MONO}`;
      ctx.fillText('AN ESSAY', M, M + 20);
      ctx.textAlign = 'right';
      ctx.fillText(`NO. ${String(number).padStart(2, '0')}`, c.width - M, M + 20);
      ctx.textAlign = 'left';
      ctx.fillStyle = essay.accent;
      ctx.fillRect(M, M + 44, 64, 6);                      // a short bar in the second ink
      ctx.fillStyle = essay.ink;
      if ('letterSpacing' in ctx) ctx.letterSpacing = '-1px';

      // Title: as large as fits in four lines.
      let size = 100, lines;
      do {
        ctx.font = `400 ${size}px "Source Serif 4", Georgia, serif`;
        lines = wrap(ctx, essay.title, c.width - M * 2);
        size -= 4;
      } while (lines.length > 4 && size > 50);
      const lead = (size + 4) * 1.08;
      lines.forEach((l, i) => ctx.fillText(l, M, M + 150 + lead * (i + 0.8)));

      // Halftone panel from the middle of the hero banner.
      const px = M, pw = c.width - M * 2, ph = Math.round(pw / 1.5), py = c.height - M - 90 - ph;
      if (hero) {
        const sh = hero.height, sw = Math.min(hero.width, sh * 1.5);
        const sx = Math.max(0, Math.min(hero.width - sw, hero.width * essay.focus - sw / 2));
        halftone(ctx, hero, sx, 0, sw, sh, px, py, pw, ph, essay);
      }

      // Author and date at the foot.
      if ('letterSpacing' in ctx) ctx.letterSpacing = '5px';
      ctx.font = `500 22px ${MONO}`;
      ctx.fillText(AUTHOR.toUpperCase(), M, c.height - M);
      ctx.textAlign = 'right';
      ctx.fillText(essay.date.toUpperCase(), c.width - M, c.height - M);
      return c;
    }

    const plain = (title) => title.replaceAll('*', '');

    // Set UVs by projecting flat along one axis, so a texture lies across the whole part.
    function projectUV(geo, uAxis, uMin, uSize, vAxis, vMin, vSize) {
      const pos = geo.attributes.position, uv = geo.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        uv.setXY(i,
          (pos.getComponent(i, uAxis) - uMin) / uSize,
          (pos.getComponent(i, vAxis) - vMin) / vSize);
      }
      uv.needsUpdate = true;
    }

    // Extrude a profile drawn in the x/z plane straight up the y axis, centred on y = 0.
    function extrudeUp(shape, height) {
      const geo = new THREE.ExtrudeGeometry(shape, { depth: height, bevelEnabled: false, curveSegments: 16 });
      geo.rotateX(Math.PI / 2);
      geo.translate(0, height / 2, 0);
      return geo;
    }

    function boardGeometry() {
      const r = S.corner, b = Math.min(0.006, BOARD * 0.3);
      const x0 = -W / 2 + b, x1 = W / 2 - b, y0 = -H / 2 + b, y1 = H / 2 - b;
      const s = new THREE.Shape();
      s.moveTo(x0, y0);                       // spine-side corners stay square
      s.lineTo(x1 - r, y0);
      s.quadraticCurveTo(x1, y0, x1, y0 + r);
      s.lineTo(x1, y1 - r);
      s.quadraticCurveTo(x1, y1, x1 - r, y1);
      s.lineTo(x0, y1);
      s.closePath();
      const geo = new THREE.ExtrudeGeometry(s, {
        depth: BOARD - b * 2, bevelEnabled: true, bevelSize: b, bevelThickness: b, bevelSegments: 3, curveSegments: 8,
      });
      geo.translate(0, 0, -(BOARD - b * 2) / 2);
      projectUV(geo, 0, -W / 2, W, 1, -H / 2, H);
      return geo;
    }

    function spineGeometry(thickness) {
      const xs = -W / 2, zo = thickness / 2, zi = thickness / 2 - BOARD;
      const s = new THREE.Shape();
      if (BULGE) {
        s.moveTo(xs, -zo);
        s.quadraticCurveTo(xs - BULGE * 2, 0, xs, zo);
        s.lineTo(xs, zi);
        s.quadraticCurveTo(xs - (BULGE - BOARD) * 2, 0, xs, -zi);
      } else {
        // Flat spine: a strip of cover, as thick as the cover, wrapped round the back of the pages.
        s.moveTo(xs, -zo);
        s.lineTo(xs, zo);
        s.lineTo(xs + BOARD, zo);
        s.lineTo(xs + BOARD, -zo);
      }
      s.closePath();
      const geo = extrudeUp(s, H);
      projectUV(geo, 2, -thickness / 2, thickness, 1, -H / 2, H);
      return geo;
    }

    function pagesGeometry(pages) {
      const xs = -W / 2 + (BULGE ? 0 : BOARD), xf = W / 2 - SQUARE, z = pages / 2;
      const s = new THREE.Shape();
      s.moveTo(xs, -z);
      s.lineTo(xf, -z);
      s.quadraticCurveTo(xf - S.foreDip, 0, xf, z);               // fore-edge dips in slightly
      s.lineTo(xs, z);
      if (BULGE) s.quadraticCurveTo(xs - (BULGE - BOARD - 0.004) * 2, 0, xs, -z);   // rounded back
      s.closePath();
      const geo = extrudeUp(s, H - SQUARE * 2);
      projectUV(geo, 2, -z, pages, 0, -W / 2, W);
      return geo;
    }

    function pagesTexture() {
      const c = canvasOf(512, 8);
      const ctx = c.getContext('2d');
      for (let x = 0; x < c.width; x++) {
        const u = x / (c.width - 1);
        // Fine page lines, shading toward the boards, and a slight warmth to the paper.
        const lines = 0.84 + 0.16 * hash(x * 3.7);
        const shade = 0.72 + 0.28 * smoothstep(0, 0.12, u) * smoothstep(1, 0.88, u);
        const v = lines * shade;
        const [pr, pg, pb] = S.pageTint || [238, 229, 210];
        ctx.fillStyle = `rgb(${Math.round(pr * v)}, ${Math.round(pg * v)}, ${Math.round(pb * v)})`;
        ctx.fillRect(x, 0, 1, c.height);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    async function main() {
      const fontsReady = Promise.race([
        Promise.all(['400 60px Fraunces', '500 60px Fraunces', '400 60px "Source Serif 4"', 'italic 400 60px "Source Serif 4"', '500 60px Inter', '600 60px Inter']
          .map((f) => document.fonts.load(f))),
        new Promise((r) => setTimeout(r, 1500)),
      ]).catch(() => {});
      const asked = SECTIONS.find((sec) => sec.id === params.get('section'));
      let section = asked || SECTIONS[0];

      // Cover art for a section: image files, or generated covers for essays.
      async function coversFor(sec) {
        useStyle(sec.style);
        if (sec.list === ESSAYS) {
          const heroes = await Promise.all(ESSAYS.map((e) => e.cover
            ? loadImage(`../assets/book/${e.cover}-cover.webp`)
            : loadImage(e.hero).catch(() => null)));
          const backs = await Promise.all(ESSAYS.map((e) => e.cover
            ? loadImage(`../assets/book/${e.cover}-back.webp`).catch(() => null) : null));
          await fontsReady;
          return ESSAYS.map((e, i) => ({
            front: e.cover ? heroes[i] : drawEssayCover(e, heroes[i], ESSAYS.length - i),
            back: backs[i],
          }));
        }
        // Paper styles (essay, zine, magazine) use a book's printed-paper cover where it has one.
        const coverOf = (b) => (S.paper && b.paperCover) || b.slug;
        const images = await Promise.all(BOOKS.map((b) => loadImage(`../assets/book/${coverOf(b)}-cover.webp`)));
        // Printed-paper covers have matching back covers; a missing one falls back to a drawn back.
        const backs = await Promise.all(BOOKS.map((b) => S.paper && b.paperCover
          ? loadImage(`../assets/book/${b.paperCover}-back.webp`).catch(() => null) : null));
        await fontsReady;
        return images.map((front, i) => ({ front, back: backs[i] }));
      }
      const firstCovers = await coversFor(section);
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      // Neutral tone mapping keeps cover colours true; filmic curves washed out the lighter cloths.
      renderer.toneMapping = THREE.NeutralToneMapping;
      stage.appendChild(renderer.domElement);
      const canvas = renderer.domElement;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(BACKDROP);
      // Fog is switched on only so materials get a fog colour; each object's
      // darkness is set directly through dimmable() below, not by distance.
      scene.fog = new THREE.Fog(BACKDROP, 100, 200);
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      // Lights are balanced so a front-facing cover renders close to its artwork's own colour.
      scene.environmentIntensity = 0.35;

      // A long lens keeps the spines nearly flat to the screen.
      const camera = new THREE.PerspectiveCamera(16, 1, 0.1, 200);

      const key = new THREE.DirectionalLight(0xfff1dc, 1.6);
      key.position.set(-4, 5, 7);
      scene.add(key);
      const glint = new THREE.DirectionalLight(0xffe2b0, 1.3);
      // Gloss catches the pointer light far more, so a glossy section gets much less of it.
      const glintFor = (style) => STYLES[style].gloss ? 0.15 : 1.3;

      const aniso = renderer.capabilities.getMaxAnisotropy();
      const tex = (source, srgb) => {

      }

      const clothMaterial = ({ art, surface, cloth }) => new THREE.MeshPhysicalMaterial({
        map: art || null,
        color: art ? 0xffffff : new THREE.Color(`rgb(${cloth.join(',')})`),
        roughnessMap: surface, metalnessMap: surface, roughness: 1, metalness: 1,
        bumpMap: surface, bumpScale: S.gloss ? 0.15 : S.paper ? 0.6 : 1.6,
        // Coated stock: a thin clear varnish that throws a crisp highlight as the light moves.
        clearcoat: S.gloss ? 0.25 : 0, clearcoatRoughness: 0.16,
        specularIntensity: S.gloss ? 0.35 : 1,      // the paper under the varnish stays soft; the varnish gives the shine

      // Shared between all books of one style
      const shared = {};
      const sharedFor = (style) => shared[style] ||= {
        boardGeo: boardGeometry(),
        pagesMat: new THREE.MeshStandardMaterial({ map: pagesTexture(), roughness: 0.95 }),
      };
      // A staple's crown, lying along the spine fold.
      const stapleGeo = new THREE.BoxGeometry(0.004, 0.2, 0.011);
      const stapleMat = new THREE.MeshStandardMaterial({ color: 0xc4c8cc, metalness: 1, roughness: 0.3 });

      // Build a section's books, hidden below the shelf until the section is shown.
      async function buildSection(sec, covers) {
        useStyle(sec.style);
        const { boardGeo, pagesMat } = sharedFor(sec.style);
        const built = [];
        const seed = SECTIONS.indexOf(sec) * 37;      // each section sits crooked in its own way
        for (const [i, info] of sec.list.entries()) {
          await new Promise((r) => setTimeout(r));      // let the page breathe between books
          useStyle(sec.style);                          // another section may have been built meanwhile
          const block = S.thickness(info.pages);       // page block thickness for this style
          const thickness = block + BOARD * 2;
          const img = covers[i].front;

          // Work from a reduced copy of the art; the cover itself stays full resolution.
          const small = canvasOf(MAP_W, MAP_H);
          const sctx = small.getContext('2d', { willReadFrequently: true });
          sctx.drawImage(img, 0, 0, MAP_W, MAP_H);
          const cloth = clothColour(sctx, MAP_W, MAP_H);
          // Essays link to their X article; annual reflections to their Instagram post.
          const post = info.href ? { href: info.href, url: info.x, source: 'X', date: info.date } : { source: 'Instagram', ...POSTS[info.slug] };

          const spineArt = drawSpine(info, cloth, thickness, post.note);
          const backArt = covers[i].back ? mirrored(covers[i].back) : drawBack(info, cloth, post.note);
          const group = new THREE.Group();
          // Phones get a reduced cover too: twelve full-size covers is a lot of GPU memory.
          const art = SMALL ? (() => { const c = canvasOf(768, 1152); c.getContext('2d').drawImage(img, 0, 0, 768, 1152); return c; })() : img;
          const front = new THREE.Mesh(boardGeo, clothMaterial({ art: tex(art, true), surface: tex(surfaceMap(small, cloth, { groove: true })), cloth }));
          const rear = new THREE.Mesh(boardGeo, clothMaterial({ art: tex(backArt, true), surface: tex(surfaceMap(backArt, cloth, { groove: true })), cloth }));
          rear.position.z = -(block + BOARD) / 2;
          const spine = new THREE.Mesh(spineGeometry(thickness), clothMaterial({ art: tex(spineArt, true), surface: tex(surfaceMap(spineArt, cloth)), cloth }));
          const pages = new THREE.Mesh(pagesGeometry(block), pagesMat.clone());
          // The front cover hinges at the spine, so it can spring open a little.
          const hinge = new THREE.Group();
          hinge.position.set(-W / 2, 0, (block + BOARD) / 2);
          hinge.rotation.y = -(S.lift || 0) * (0.7 + 0.6 * hash(seed + i + 11));
          front.position.x = W / 2;

          const parts = [front, rear, spine, pages];
          if (S.staples) {

          const book = {

            roll: S.jitter ? (hash(seed + i + 3) - 0.5) * 0.07 : 0, rollNow: 0,

      }
      section.books = await buildSection(section, firstCovers);
      let books = section.books;
      glint.intensity = glintFor(section.style);
      useStyle(section.style);

      // Where the camera sits, and where a book floats while its post is being read.
      const feature = new THREE.Vector3();
      let viewDist = 10, featureDist = 8;
      let dirty = true;               // something changed that needs a fresh render
      function resize() {
        const w = stage.clientWidth, h = stage.clientHeight;
        // Sharp on retina, but capped at ~4 million pixels so big screens stay fast.
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2, Math.sqrt(4e6 / (w * h))));
        renderer.setSize(w, h, false);
        dirty = true;
        camera.aspect = w / h;
        const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
        const fit = (height, width) => Math.max(height / 2 / tan, width / 2 / (tan * camera.aspect));
        const narrow = camera.aspect < 1;
        // Room for the front-facing book plus a few spines or covers either side.
        // Tall screens keep the front book large and let the rest run off the edges.
        const viewWidth = STYLES[section.style].viewWidth;
        viewDist = fit(H / 0.56, (narrow ? Math.min(viewWidth, W + 1.0) : viewWidth) / 0.92);
        // The read view shares the screen with its text: left half when wide, top half when tall.
        featureDist = Math.min(narrow ? fit(H / 0.4, (W + 0.9) / 0.88) : fit(H / 0.68, (W + 0.9) / 0.44), viewDist - 1.5);
        // Centre the front book and its title, as one block, in the space between the
        // section names and the bottom bar, pulling back if the screen is too short for them.
        const TITLE_GAP = narrow ? 22 : 26;             // between the book's foot and its title
        const titleSize = Math.min(Math.max(20, 0.026 * w), 36.8);   // matches #titles .t font-size
        const titleH = titleSize * 1.12 * (narrow ? 2 : 1.3);      // long titles wrap on phones
        const room = {
          top: document.getElementById('sections').getBoundingClientRect().bottom + (narrow ? 28 : 24),
          bottom: document.querySelector('.bar.bottom').getBoundingClientRect().top - 8,
        };
        const space = room.bottom - room.top;
        const bookRoom = Math.max(80, space - TITLE_GAP - titleH);
        viewDist = Math.max(viewDist, (H * h) / (2 * tan * bookRoom));   // H: the largest books
        const perPx = (2 * tan * viewDist) / h;          // world units per screen pixel at the books
        const bookPx = (H * section.scale) / perPx;
        const block = bookPx + TITLE_GAP + titleH;
        const centre = room.top + Math.max(0, space - block) / 2 + bookPx / 2;
        const lookY = (centre - h / 2) * perPx;          // aim above the books to set them lower, and vice versa
        const look = new THREE.Vector3(0, lookY, 0);

      }
      addEventListener('resize', resize);
      resize();
      document.fonts.ready.then(resize);     // the section names' height depends on their font

      // ---------- Title strip ----------
      const track = titles.firstElementChild;
      let titleEls = [];
      function buildTitles() {
      track.replaceChildren();
      titleEls = books.map((book) => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 't';
        book.info.title.split('*').forEach((part, i) => {
          const span = document.createElement(i % 2 ? 'em' : 'span');
          span.textContent = part;
          el.appendChild(span);
        });
        if (book.post.note) {
          const sup = document.createElement('sup');
          sup.textContent = `(${book.post.note})`;
          el.appendChild(sup);

        track.appendChild(el);
        return el;
      });
      }
      buildTitles();
      function layoutTitles() {
        const el = titleEls[active];
        track.style.transform = `translateX(${innerWidth / 2 - (el.offsetLeft + el.offsetWidth / 2)}px)`;
        titleEls.forEach((t, i) => t.classList.toggle('on', i === active));

      addEventListener('resize', layoutTitles);
      document.fonts.ready.then(layoutTitles);

      const REST = 0.35;                      // angle a book settles at while its post is read
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let active = section.active, hovered = null, reading = null, focus = 0;

      let px = 0, py = 0, sx = 0, sy = 0;

      function bookAt(e) {

      }
      function updateUI() {
        const book = books[active];

        postLink.hidden = !book.post.url;
        if (book.post.url) { postLink.href = book.post.url; postLink.textContent = `+ ${book.post.source} +`; }
        backBtn.hidden = !reading;
        hint.hidden = !!reading;
        titles.classList.toggle('away', !!reading);

        canvas.classList.toggle('hover', !reading && !!hovered && hovered.index !== active);

      function setActive(i) {

        active = section.active = i;
        showActions = false; overActions = false;
        layoutTitles();
        updateUI();
      }
      function fillPanel(book) {
        const post = book.post;
        const inner = panel.firstElementChild;
        const add = (tag, cls, text) => {
          const el = document.createElement(tag);
          if (cls) el.className = cls;
          if (text) el.textContent = text;
          return inner.appendChild(el);
        };

        if (post.note) add('div', 'note', post.note);
        add('h2', '', plain(book.info.title));
        const meta = add('div', 'meta', post.date ? `${post.date} · ` : 'Brett Goldstein');
        if (post.comingSoon) add('div', 'soon', 'Coming soon');
        if (post.url) {
          const link = document.createElement('a');
          link.href = post.url; link.target = '_blank'; link.rel = 'noopener';
          link.textContent = post.source;
          meta.appendChild(link);
        }
        (post.text || '').split(/\n{2,}/).filter(Boolean).forEach((para) => add('p', '', para));

          const link = document.createElement('a');
          link.href = post.href;
          link.textContent = 'Open as a page';
          meta.append(' · ', link);

          essayBody(post.href).then((nodes) => {
            if (reading === book) body.replaceChildren(...nodes);
          }).catch(() => {
            const p = document.createElement('p');
            p.textContent = 'This essay couldn’t be loaded here. ';
            const a = document.createElement('a');
            a.href = post.href; a.textContent = 'Read it on its page.';
            p.appendChild(a);
            if (reading === book) body.replaceChildren(p);

      }

      // Fetch an essay's page and take the body of the article, with its links and media
      // pointed at the right files from here. Kept after the first fetch.
      const essayCache = new Map();
      function essayBody(href) {
        if (!essayCache.has(href)) {

            if (!r.ok) throw new Error(`${r.status} for ${base}`);

          }).then((html) => {
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const article = doc.querySelector('.article-body');
            if (!article) throw new Error(`no article body in ${base}`);
            article.querySelectorAll('script, style').forEach((el) => el.remove());
            for (const [sel, attr] of [['img', 'src'], ['source', 'src'], ['video', 'poster'], ['a', 'href']]) {
              article.querySelectorAll(`${sel}[${attr}]`).forEach((el) => {
                el.setAttribute(attr, new URL(el.getAttribute(attr), base).href);

            }
            article.querySelectorAll('a[href]').forEach((a) => {
              if (new URL(a.href).origin !== location.origin) { a.target = '_blank'; a.rel = 'noopener'; }
            });
            article.querySelectorAll('img').forEach((img) => { img.loading = 'lazy'; });
            return article;
          }).catch((err) => { essayCache.delete(href); throw err; }));
        }

        return essayCache.get(href).then((article) => [...article.cloneNode(true).childNodes]);
      }
      function openRead() {
        const book = books[active];
        reading = book; hovered = null; showActions = false; overActions = false;
        spin = 0; velocity = 0; tilt = 0;

      }
      function closeRead() {
        if (!reading) return;

        reading.rot = Math.atan2(Math.sin(reading.rot), Math.cos(reading.rot));
        reading = null;
        panel.classList.remove('open');
        panel.querySelectorAll('video, audio').forEach((m) => m.pause());
        updateUI();
      }

      // ---------- Sections ----------
      const sectionNav = document.getElementById('sections');
      const sectionBtns = SECTIONS.map((sec) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = sec.label;
        b.addEventListener('click', () => showSection(sec));
        sectionNav.appendChild(b);
        return b;
      });
      function markSection() {
        sectionBtns.forEach((b, i) => b.classList.toggle('on', SECTIONS[i] === section));
      }
      const SLIDE = 12;               // how far off to the side a section waits while another is shown
      function raise(sec, dir) {
        sec.books.forEach((book, i) => {
          book.group.visible = true;
          book.exit = undefined;
          book.dim.value = 0;

          // Switching sections: the shelf slides along, in the direction you're browsing.
          else if (dir) book.group.position.set(dir * SLIDE + (i - sec.active) * FAN_STEP, 0, -FAN_BACK);

          else book.group.position.set(0, -H * 1.4 - i * 0.5, 0);

      let switching = null;
      async function showSection(sec, at) {
        if (sec === section || switching) return;
        closeRead();
        switching = sec;
        if (!sec.books) sec.books = await (sec.building ||= coversFor(sec).then((covers) => buildSection(sec, covers)));
        switching = null;
        const dir = Math.sign(SECTIONS.indexOf(sec) - SECTIONS.indexOf(section));

        for (const book of section.books) book.exit = book.group.position.x - dir * SLIDE;
        section = sec;
        useStyle(sec.style);
        books = sec.books;
        if (at !== undefined) sec.active = at;
        active = sec.active;
        hovered = null; showActions = false; overActions = false;
        glint.intensity = glintFor(sec.style);
        raise(sec, dir);
        buildTitles();
        layoutTitles();
        markSection();
        resize();
        updateUI();
        const url = new URL(location.href);
        url.searchParams.set('section', sec.id);
        history.replaceState(null, '', url);
      }

      // Browse one book along; past either end of a section, carry on into the next one.
      function step(dir) {
        const next = active + dir;
        if (next >= 0 && next < books.length) return setActive(next);
        const neighbour = SECTIONS[SECTIONS.indexOf(section) + dir];
        if (neighbour) showSection(neighbour, dir > 0 ? 0 : neighbour.list.length - 1);
      }

      // ---------- Input ----------
      canvas.addEventListener('pointerdown', (e) => {
        down = { x: e.clientX, y: e.clientY, book: bookAt(e), type: e.pointerType };
        lastX = e.clientX; lastY = e.clientY;

      canvas.addEventListener('pointermove', (e) => {

      canvas.addEventListener('pointerup', (e) => {
        const dx = down ? e.clientX - down.x : 0;
        const wasClick = down && Math.hypot(dx, e.clientY - down.y) < 6;
        if (dragging) { dragging = false; canvas.classList.remove('dragging'); }
        if (down && !reading && !wasClick && Math.abs(dx) > 40) {
          step(dx < 0 ? 1 : -1);      // swipe through the row
        } else if (wasClick) {
          const book = down.book;
          if (reading) { if (book !== reading) closeRead(); }
          else if (book && book.index !== active) setActive(book.index);

          else showActions = false;           // tap on empty space hides them
        }
        down = null;
      });
      canvas.addEventListener('pointercancel', () => { dragging = false; down = null; canvas.classList.remove('dragging'); });

      actions.addEventListener('pointerleave', () => { overActions = false; });
      readBtn.addEventListener('click', openRead);
      addEventListener('pointermove', (e) => {
        px = (e.clientX / innerWidth) * 2 - 1;
        py = (e.clientY / innerHeight) * 2 - 1;
      });
      addEventListener('keydown', (e) => {
        const onControl = e.target.closest && e.target.closest('button, a, input');

      // ---------- Animation ----------
      const GAP = 0.34;               // space between spines
      const ROOM = 0.3;               // extra space either side of the front-facing book
      const clock = new THREE.Clock();
      const target = new THREE.Vector3();
      const screen = new THREE.Vector3();
      // The fan: covers either side of the front one, turned in toward it and overlapping.
      const FAN_TURN = 1.1;           // how far the side covers turn away from the camera
      const FAN_FIRST = 0.15;         // gap between the front cover and its nearest neighbour
      const FAN_STEP = 0.42;          // spacing between the side covers
      const FAN_BACK = 0.45;          // how far behind the front cover the side covers stand
      const RACK = -0.06;             // everything leans back slightly, as if propped on a ledge
      let slots = [];
      function layoutRow() {
        if (STYLES[section.style].layout === 'fan') {

          slots = books.map((book, i) => {
            const d = i - active;

        }

        slots = books.map((book, i) => {
          const width = i === active ? W : book.thickness;
          if (i > 0) cursor += GAP + (i === active || i - 1 === active ? ROOM : 0);
          const x = cursor + width / 2;
          cursor += width;
          return x;
        });

        slots = slots.map((x) => (x - centre) * section.scale);
      }

      function frame() {
        const dt = Math.min(clock.getDelta(), 0.05);
        const t = clock.elapsedTime;
        const ease = (rate) => 1 - Math.exp(-dt * rate);

        if (!dragging) { spin += velocity; velocity *= Math.pow(0.95, dt * 60); tilt *= Math.pow(0.94, dt * 60); }
        const psx = sx, psy = sy;
        sx += (px - sx) * ease(3.6);
        sy += (py - sy) * ease(3.6);
        let motion = Math.abs(sx - psx) + Math.abs(sy - psy) + Math.abs(velocity);

        const st = STYLES[section.style];
        // Books of the other section slide off to the side, then stop drawing.
        for (const sec of SECTIONS) {
          if (sec === section || !sec.books) continue;
          for (const book of sec.books) {
            if (!book.group.visible) continue;
            target.copy(book.group.position).setX(book.exit ?? book.group.position.x);
            if (book.exit === undefined) target.y = -H * 1.8;
            motion += book.group.position.distanceTo(target);
            book.group.position.lerp(target, ease(7));
            book.dim.value += (1 - book.dim.value) * ease(5);
            if (book.group.position.distanceTo(target) < 0.05 || book.dim.value > 0.98) book.group.visible = false;
          }
        }
        for (const book of books) {
          const isActive = book.index === active;
          let rot = SPINE_OUT, lean = 0;
          if (book === reading) {
            target.copy(feature);
            if (!reduceMotion) target.y += Math.sin(t * 0.9) * 0.03;
            rot = REST + spin + (reduceMotion ? 0 : Math.sin(t * 0.6) * 0.09) + sx * 0.22;
            lean = 0.05 + tilt + sy * 0.1;
          } else if (st.layout === 'fan') {
            const d = book.index - active;
            target.set(slots[book.index], 0, isActive ? 0 : -FAN_BACK);
            lean = RACK;
            if (isActive) {
              rot = reduceMotion ? 0 : sx * 0.12;
              lean += reduceMotion ? 0 : sy * 0.05;
            } else {
              rot = -Math.sign(d) * FAN_TURN;          // side covers turn in toward the front one
              if (book === hovered) target.z += 0.18;
            }
          } else {
            // Spines line up on one plane; the front-facing cover sits just proud of them.
            target.set(slots[book.index], 0, isActive ? W / 2 + 0.12 - book.thickness / 2 : 0);
            if (isActive) {
              rot = reduceMotion ? 0 : sx * 0.12;     // turns a touch toward the pointer
              lean = reduceMotion ? 0 : sy * 0.05;
            } else if (book === hovered) {
              target.z += 0.18;
            }
          }
          if (book !== reading) target.y += book.bob;
          const roll = book === reading ? 0 : isActive ? book.roll * 0.4 : book.roll;
          motion += book.group.position.distanceTo(target) + Math.abs(rot - book.rot) + Math.abs(lean - book.tilt) + Math.abs(roll - book.rollNow);
          book.group.position.lerp(target, ease(book === reading ? 5 : 7));
          book.rot += (rot - book.rot) * ease(book === reading ? 9 : 7);
          book.tilt += (lean - book.tilt) * ease(9);
          book.rollNow += (roll - book.rollNow) * ease(7);
          book.group.rotation.set(book.tilt, book.rot, book.rollNow);

          // Spines beside the front-facing book sit slightly in shadow; while reading, all but one vanish.
          const goal = reading ? (book === reading ? 0 : 1) : (isActive ? 0 : st.dimSide);
          motion += Math.abs(goal - book.dim.value);
          book.dim.value += (goal - book.dim.value) * ease(reading ? 14 : 6);
        }

        motion += Math.abs((reading ? 1 : 0) - focus);
        focus += ((reading ? 1 : 0) - focus) * ease(reading ? 14 : 8);
        // Text fades in only once the background is dark and the book has nearly arrived,
        // and fades out first when the book goes back.
        const arrived = reading ? 1 - reading.group.position.distanceTo(feature) / reading.from : 0;
        panel.style.opacity = smoothstep(0.75, 0.98, focus) * smoothstep(0.6, 0.9, arrived);

        // The hover buttons sit over the middle of the front-facing cover.
        const shown = !reading && (showActions || overActions);
        actions.classList.toggle('show', shown);
        if (shown) {
          screen.copy(books[active].group.position).project(camera);
          actions.style.transform = `translate(${(screen.x + 1) / 2 * innerWidth}px, ${(1 - screen.y) / 2 * innerHeight}px) translate(-50%, -50%)`;
        }

        // A light near the camera that follows the pointer, so foil catches it as you move.
        glint.position.set(sx * 8, H * 0.5 - sy * 6, viewDist * 0.6);
        // Once everything has settled, stop drawing until something moves. A book being
        // read keeps a gentle sway, so that view always draws.
        if (dirty || motion > 1e-4 || (reading && !reduceMotion)) renderer.render(scene, camera);
        dirty = false;
        requestAnimationFrame(frame);
      }
      raise(section);
      markSection();
      layoutTitles();
      updateUI();
      frame();
      clearTimeout(window.shelfFallback);
      canvas.classList.add('ready');
      flat.classList.add('hidden');
      document.getElementById('loading').classList.add('done');
      titles.classList.add('ready');
      sectionNav.classList.add('ready');

      // Build the other sections quietly in the background, so switching is instant.
      for (const sec of SECTIONS) {
        if (sec.books || sec.building) continue;
        sec.building = coversFor(sec).then((covers) => buildSection(sec, covers));
        sec.books = await sec.building;
        useStyle(section.style);
      }
    }

    // If 3D can't run, fall back to the flat covers.
    main().catch((err) => {
      console.error('3D shelf failed to start; showing the flat covers.', err);
      clearTimeout(window.shelfFallback);
      window.showFlat();
    });
  </script>
